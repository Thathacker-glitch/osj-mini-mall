<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVERSABIJOJO - Accessories & Jewelry</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-red: #e63946;
      --accent-green: #2ec4b6;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-color: #2a354d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* Header */
    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 15, 25, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-red);
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
      display: block;
    }

    /* Hero Banner */
    .hero-banner {
      margin: 16px;
      padding: 20px;
      background: linear-gradient(135deg, #d62828 0%, #003049 100%);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(230, 57, 70, 0.2);
    }

    .hero-tag {
      background: #fff;
      color: #000;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 10px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .hero-banner h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .hero-banner p {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Search & Filters */
    .search-box {
      margin: 0 16px 16px 16px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 16px 16px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      color: var(--text-sub);
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    /* Feed Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-image {
      width: 100%;
      height: 130px;
      border-radius: 10px;
      object-fit: cover;
      background: #0b0f19;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .product-price {
      color: var(--accent-red);
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .offer-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-red);
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modals & Panels */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      border-top: 1px solid var(--border-color);
    }

    .chat-box {
      height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-msg {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      max-width: 80%;
    }

    .chat-msg.bot {
      background: #2a354d;
      align-self: flex-start;
    }

    .chat-msg.user {
      background: var(--accent-red);
      align-self: flex-end;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0b0f19;
      color: #fff;
    }

    /* Admin Panel */
    .admin-form label {
      font-size: 12px;
      color: var(--text-sub);
      display: block;
      margin-top: 10px;
    }

    .admin-form input, .admin-form select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(21, 28, 44, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-sub);
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent-red);
    }

    .nav-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <span class="brand-logo">OVERSABIJOJO</span>
      <span class="brand-sub">Accessories & Jewelry</span>
    </div>
  </header>

  <!-- Views Wrapper -->
  <div id="home-view">
    <!-- Hero Banner -->
    <div class="hero-banner">
      <span class="hero-tag">FLASH SALE</span>
      <h2>Beautiful accessories at amazing prices.</h2>
      <p>Negotiate directly with our automated live agent.</p>
    </div>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" placeholder="Search accessories..." id="search-input" onkeyup="filterProducts()" />
    </div>

    <!-- Categories -->
    <div class="categories-bar">
      <div class="cat-chip active" onclick="filterCategory('All', this)">All</div>
      <div class="cat-chip" onclick="filterCategory('Jewelry', this)">Jewelry</div>
      <div class="cat-chip" onclick="filterCategory('Bags', this)">Bags</div>
      <div class="cat-chip" onclick="filterCategory('Watches', this)">Watches</div>
      <div class="cat-chip" onclick="filterCategory('Hair', this)">Hair</div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="product-grid"></div>
  </div>

  <!-- Admin / Account View -->
  <div id="admin-view" style="display: none; padding: 20px;">
    <h2 style="margin-bottom: 16px;">Admin Product Upload</h2>
    <form class="admin-form" onsubmit="addNewProduct(event)">
      <label>Product Title</label>
      <input type="text" id="p-title" required placeholder="e.g. Designer Gold Necklace" />

      <label>Category</label>
      <select id="p-category">
        <option value="Jewelry">Jewelry</option>
        <option value="Bags">Bags</option>
        <option value="Watches">Watches</option>
        <option value="Hair">Hair</option>
      </select>

      <label>Price (₦)</label>
      <input type="number" id="p-price" required placeholder="e.g. 35000" />

      <label>Image URL</label>
      <input type="url" id="p-image" required placeholder="https://example.com/image.jpg" />

      <button type="submit" class="offer-btn" style="margin-top: 16px; background: var(--accent-green);">Upload Product</button>
    </form>
  </div>

  <!-- AliExpress-Style Negotiation Chat Modal -->
  <div class="modal" id="chat-modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 id="modal-item-name" style="font-size: 14px;">Negotiate Price</h3>
        <span style="cursor: pointer; font-weight: bold;" onclick="closeModal()">✕</span>
      </div>

      <div class="chat-box" id="chat-box"></div>

      <div class="input-row">
        <input type="number" id="offer-input" placeholder="Enter offer in ₦..." />
        <button class="offer-btn" style="width: auto; padding: 0 16px;" onclick="sendOffer()">Send</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchTab('orders', this)">
      <span class="nav-icon">🛍️</span>
      <span>Orders</span>
    </div>
    <div class="nav-item" onclick="switchTab('admin', this)">
      <span class="nav-icon">👤</span>
      <span>Account</span>
    </div>
  </nav>

  <script>
    const BACKEND_URL = "https://oversabijojo.onrender.com";

    // Default Products
    let defaultProducts = [
      { id: 1, name: "Elegant Crystal Necklace", category: "Jewelry", price: 18500, image: "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400" },
      { id: 2, name: "Luxury Mini Handbag", category: "Bags", price: 35000, image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400" },
      { id: 3, name: "Classic Ladies Watch", category: "Watches", price: 27500, image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400" },
      { id: 4, name: "Premium Hair Accessories", category: "Hair", price: 12000, image: "https://images.unsplash.com/photo-1606760227091-3dd850d97f1d?w=400" }
    ];

    let currentItem = null;
    let selectedCategory = "All";

    // Shuffle Array for Automatic Page Refresh Effect
    function shuffleArray(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function getStoredProducts() {
      const stored = localStorage.getItem("oversabi_products");
      return stored ? JSON.parse(stored) : defaultProducts;
    }

    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      
      let products = shuffleArray(getStoredProducts());

      if (selectedCategory !== "All") {
        products = products.filter(p => p.category === selectedCategory);
      }

      products.forEach(product => {
        grid.innerHTML += `
          <div class="product-card">
            <img src="${product.image}" class="product-image" alt="${product.name}" />
            <div>
              <div class="product-title">${product.name}</div>
              <div class="product-price">₦${product.price.toLocaleString()}</div>
            </div>
            <button class="offer-btn" onclick="openChat('${product.name}', ${product.price})">Negotiate / Offer</button>
          </div>
        `;
      });
    }

    function filterCategory(cat, element) {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      selectedCategory = cat;
      renderProducts();
    }

    function openChat(name, price) {
      currentItem = { name, price };
      document.getElementById("modal-item-name").innerText = `${name} (₦${price.toLocaleString()})`;
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = `
        <div class="chat-msg bot">Hello! The listed price for ${name} is ₦${price.toLocaleString()}. What is your best offer?</div>
      `;
      document.getElementById("chat-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("chat-modal").classList.remove("active");
    }

    function sendOffer() {
      const input = document.getElementById("offer-input");
      const offerAmount = Number(input.value);
      if (!offerAmount) return;

      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<div class="chat-msg user">₦${offerAmount.toLocaleString()}</div>`;

      // STRICT 10% FLOOR RULE: Minimum price allowed is 90% of original price
      const minAcceptable = currentItem.price * 0.90;

      setTimeout(() => {
        if (offerAmount >= minAcceptable) {
          chatBox.innerHTML += `
            <div class="chat-msg bot" style="background: var(--accent-green); color: #000;">
              🎉 <strong>Offer Accepted!</strong><br/>
              Your price of ₦${offerAmount.toLocaleString()} has been approved. Proceed to checkout!
            </div>
          `;
        } else {
          chatBox.innerHTML += `
            <div class="chat-msg bot" style="background: var(--accent-red);">
              ❌ <strong>Offer Rejected.</strong><br/>
              The discount limit for this item is 10%. The minimum offer we can accept is ₦${minAcceptable.toLocaleString()}.
            </div>
          `;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);

      input.value = "";
    }

    function addNewProduct(e) {
      e.preventDefault();
      const newP = {
        id: Date.now(),
        name: document.getElementById("p-title").value,
        category: document.getElementById("p-category").value,
        price: Number(document.getElementById("p-price").value),
        image: document.getElementById("p-image").value
      };

      const products = getStoredProducts();
      products.push(newP);
      localStorage.setItem("oversabi_products", JSON.stringify(products));

      alert("Product uploaded successfully!");
      e.target.reset();
      switchTab('home', document.querySelectorAll('.nav-item')[0]);
    }

    function switchTab(tab, element) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      element.classList.add('active');

      if (tab === 'home') {
        document.getElementById("home-view").style.display = "block";
        document.getElementById("admin-view").style.display = "none";
        renderProducts();
      } else if (tab === 'admin') {
        document.getElementById("home-view").style.display = "none";
        document.getElementById("admin-view").style.display = "block";
      }
    }

    // Initialize Page Load
    renderProducts();
  </script>
</body>
</html>
