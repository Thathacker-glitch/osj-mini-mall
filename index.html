<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oversabijojo - Online Store</title>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    :root {
      --primary: #ff4747;
      --primary-dark: #d63030;
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --border: #e5e5ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background-color: #eee;
    }

    .product-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-price {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: auto;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      margin-top: 6px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Oversabijojo</div>
    <div id="user-display" style="font-size: 0.85rem; color: var(--text-muted);">Guest</div>
  </header>

  <!-- Welcome / Sign-up Pop-up Modal -->
  <div id="signup-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">Welcome to Oversabijojo!</div>
      <div class="modal-desc">Please enter your details to personalize your shopping experience.</div>
      <form id="signup-form">
        <div class="input-group">
          <label for="user-name">Full Name</label>
          <input type="text" id="user-name" required placeholder="e.g. Jane Doe">
        </div>
        <div class="input-group">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" required placeholder="e.g. jane@example.com">
        </div>
        <div class="input-group">
          <label for="user-phone">Phone Number</label>
          <input type="tel" id="user-phone" required placeholder="e.g. 08012345678">
        </div>
        <button type="submit" class="btn btn-primary">Start Shopping</button>
        <button type="button" class="btn btn-outline" id="skip-signup">Continue as Guest</button>
      </form>
    </div>
  </div>

  <main class="container">
    <h2 style="margin-bottom: 12px; font-size: 1.1rem;">Featured Products</h2>
    <div class="products-grid" id="products-list">
      <!-- Products generated by JavaScript -->
    </div>
  </main>

  <div class="cart-bar">
    <div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">Total Amount</div>
      <div style="font-size: 1.1rem; font-weight: 700;" id="cart-total">₦0.00</div>
    </div>
    <button class="btn btn-primary" style="width: auto; padding: 10px 24px;" id="checkout-btn">Checkout</button>
  </div>

  <script>
    // ==========================================
    // STORE CONFIGURATION & API KEYS
    // ==========================================
    const PAYSTACK_PUBLIC_KEY = 'pk_test_2b08e01f6068d0c2859d1024513921d7c48ab484';
    const ADMIN_WHATSAPP_NUMBER = '2349056558869';

    // Sample Products Data
    const products = [
      { id: 1, name: 'Gold Layered Necklace', price: 8500, image: 'https://via.placeholder.com/150' },
      { id: 2, name: 'Crystal Hoop Earrings', price: 4500, image: 'https://via.placeholder.com/150' },
      { id: 3, name: 'Minimalist Wristwatch', price: 12000, image: 'https://via.placeholder.com/150' }
    ];

    let cart = [];
    let currentUser = JSON.parse(localStorage.getItem('oversabi_user')) || null;

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      checkUserSession();
      renderProducts();
    });

    // Check Sign-Up Modal Status
    function checkUserSession() {
      const modal = document.getElementById('signup-modal');
      const userDisplay = document.getElementById('user-display');
      
      if (currentUser) {
        userDisplay.textContent = currentUser.name;
        modal.classList.add('hidden');
      } else {
        modal.classList.remove('hidden');
      }
    }

    // Handle Sign-Up Form Submit
    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      currentUser = {
        name: document.getElementById('user-name').value,
        email: document.getElementById('user-email').value,
        phone: document.getElementById('user-phone').value
      };
      localStorage.setItem('oversabi_user', JSON.stringify(currentUser));
      checkUserSession();
    });

    // Handle Skip Sign-Up
    document.getElementById('skip-signup').addEventListener('click', () => {
      document.getElementById('signup-modal').classList.add('hidden');
    });

    // Render Product Cards
    function renderProducts() {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" class="product-image" alt="${product.name}">
          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-price">₦${product.price.toLocaleString()}</div>
            <button class="btn btn-primary" onclick="addToCart(${product.id})">Add to Cart</button>
            <button class="btn btn-outline" onclick="openHaggle('${product.name}', ${product.price})">Haggle Price</button>
          </div>
        </div>
      `).join('');
    }

    // Add Item to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (product) {
        cart.push(product);
        updateCartTotal();
      }
    }

    // Update Cart Total Display
    function updateCartTotal() {
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').textContent = `₦${total.toLocaleString()}`;
    }

    // Open WhatsApp Haggle
    function openHaggle(productName, originalPrice) {
      const message = encodeURIComponent(`Hello, I would like to make an offer for "${productName}" (Original: ₦${originalPrice.toLocaleString()}).`);
      window.open(`https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${message}`, '_blank');
    }

    // Paystack Checkout Integration
    document.getElementById('checkout-btn').addEventListener('click', () => {
      const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);

      if (totalAmount === 0) {
        alert('Your cart is empty!');
        return;
      }

      const email = currentUser ? currentUser.email : 'customer@oversabijojo.com';

      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: email,
        amount: totalAmount * 100, // Amount in kobo
        currency: 'NGN',
        callback: function(response) {
          const successMessage = encodeURIComponent(`Hello! I just completed a payment of ₦${totalAmount.toLocaleString()} for my order. Payment Reference: ${response.reference}`);
          window.open(`https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${successMessage}`, '_blank');
          cart = [];
          updateCartTotal();
        },
        onClose: function() {
          alert('Transaction was cancelled.');
        }
      });

      handler.openIframe();
    });
  </script>
</body>
</html>
